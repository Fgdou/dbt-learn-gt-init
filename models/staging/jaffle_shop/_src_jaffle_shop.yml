sources:
  - name: jaffle_shop
    description: A clone of a Postgres database
    database: raw
    schema: jaffle_shop    
    tables:
      - name: customers
        description: Raw customers data
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null
      - name: orders      
        config:
          freshness: 
            error_after:
              count: 2
              period: day
            warn_after:
              count: 1
              period: day
          loaded_at_field: _etl_loaded_at